name: CI Tests & Checks

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run project compilation check
        run: |
          python -m compileall -q nemus scripts

      - name: Run offline test scripts
        env:
          QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          python scripts/test_language.py
          python scripts/test_tools.py
          python scripts/test_mcp.py
          python scripts/test_realtime.py
          python scripts/smoke_agent.py
          python scripts/smoke_gui.py
          python scripts/smoke_realtime_app.py
